
name: Build Bima Kirana APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: unzip -o BimaKiranaApp-buildable.zip

      - name: Build APK
        run: |
          cd BimaKiranaApp
          gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Bima-Kirana-APK
          path: BimaKiranaApp/app/build/outputs/apk/debug/app-debug.apk
